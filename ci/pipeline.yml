resources:
  - name: dashboard-source
    type: git
    source:
      uri: https://github.com/marijaannaadamsone/energy-monitoring-dashboard.git
      branch: ((git-branch))

  - name: dashboard-image
    type: registry-image
    source:
      repository: marijaanna/energy-dashboard
      tag: ci-test
      username: ((dockerhub-username))
      password: ((dockerhub-token))

jobs:
  - name: build-dashboard
    plan:
      - get: dashboard-source
        trigger: true

      - task: validate-app
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"

          inputs:
            - name: dashboard-source

          run:
            path: sh
            args:
              - -ec
              - |
                test -s dashboard-source/index.html
                test -s dashboard-source/Dockerfile
                grep -qi '<html' dashboard-source/index.html
                echo "HTML validation passed!"

      - task: build-image
        privileged: true
        config:
          platform: linux

          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task

          inputs:
            - name: dashboard-source

          outputs:
            - name: image

          params:
            CONTEXT: dashboard-source

          run:
            path: build

      - put: dashboard-image
        params:
          image: image/image.tar
        get_params:
          skip_download: true

      - task: prepare-ecs-deployment
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"
          inputs:
            - name: dashboard-image
          outputs:
            - name: deploy-info
          run:
            path: sh
            args:
              - -ec
              - |
                REPO="$(cat dashboard-image/repository)"
                DIGEST="$(cat dashboard-image/digest)"

                case "$DIGEST" in
                  sha256:*) ;;
                  *) echo "Invalid image digest"; exit 1 ;;
                esac

                IMAGE_URI="${REPO}@${DIGEST}"

                printf '%s\n' "$IMAGE_URI" > deploy-info/image-uri.txt
                echo "Prepared image: $IMAGE_URI"

      - task: verify-ecs-deployment-inputs
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: bash
              tag: "5.2"
          inputs:
            - name: dashboard-source
            - name: deploy-info
          run:
            path: bash
            args:
              - -euc
              - |
                test -s dashboard-source/ci/deploy-ecs.sh
                bash -n dashboard-source/ci/deploy-ecs.sh

                test -s deploy-info/image-uri.txt
                IMAGE_URI="$(cat deploy-info/image-uri.txt)"

                case "$IMAGE_URI" in
                  *@sha256:*) ;;
                  *) echo "Invalid image URI"; exit 1 ;;
                esac

                echo "Deployment script syntax OK"
                echo "Docker image: $IMAGE_URI"
                echo "ECS deployment inputs verified!"

      - task: ecs-deployment-apply
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"
          inputs:
            - name: deploy-info
          params:
            SSH_DEPLOY_KEY: ((deploy-ssh-private-key))
            SSH_KNOWN_HOSTS: ((deploy-ssh-known-hosts))
          run:
            path: sh
            args:
              - -ec
              - |
                apk add --no-cache openssh-client >/dev/null

                umask 077
                printf '%s\n' "$SSH_DEPLOY_KEY" > /tmp/deploy-key
                printf '%s\n' "$SSH_KNOWN_HOSTS" > /tmp/known_hosts

                IMAGE_URI="$(cat deploy-info/image-uri.txt)"

                ssh \
                  -o BatchMode=yes \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile=/tmp/known_hosts \
                  -i /tmp/deploy-key \
                  concourse-deploy@172.31.4.183 \
                  "apply $IMAGE_URI"

                echo "Concourse ECS deployment apply succeeded!"
