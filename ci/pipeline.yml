
resources:
  - name: dashboard-source
    type: git
    source:
      uri: https://github.com/marijaannaadamsone/energy-monitoring-dashboard.git
      branch: main

  - name: dashboard-image
    type: registry-image
    source:
      repository: marijaanna/energy-dashboard
      tag: ci-test
      username: ((dockerhub-username))
      password: ((dockerhub-token))

jobs:
  - name: build-dashboard
    plan:
      - get: dashboard-source
        trigger: true

      - task: validate-app
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"

          inputs:
            - name: dashboard-source

          run:
            path: sh
            args:
              - -ec
              - |
                test -s dashboard-source/index.html
                test -s dashboard-source/Dockerfile
                grep -qi '<html' dashboard-source/index.html
                echo "HTML validation passed!"

      - task: build-image
        privileged: true
        config:
          platform: linux

          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task

          inputs:
            - name: dashboard-source

          outputs:
            - name: image

          params:
            CONTEXT: dashboard-source

          run:
            path: build

      - put: dashboard-image
        params:
          image: image/image.tar
        get_params:
          skip_download: true


      - task: prepare-ecs-deployment
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
              tag: "3.20"
          inputs:
            - name: dashboard-image
          outputs:
            - name: deploy-info
          run:
            path: sh
            args:
              - -ec
              - |
                REPO="$(cat dashboard-image/repository)"
                DIGEST="$(cat dashboard-image/digest)"

                case "$DIGEST" in
                  sha256:*) ;;
                  *) echo "Invalid image digest"; exit 1 ;;
                esac

                IMAGE_URI="${REPO}@${DIGEST}"

                printf '%s\n' "$IMAGE_URI" > deploy-info/image-uri.txt
                echo "Prepared image: $IMAGE_URI"